apiVersion: v1
kind: Secret
metadata:
  name: my-minio-cred
  namespace: argo
type: Opaque
stringData:
  accessKey: minioadmin
  secretKey: minioadmin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-repositories
  namespace: argo
  annotations:
    workflows.argoproj.io/default-artifact-repository: default-v1
data:
  default-v1: |
    s3:
      bucket: my-bucket
      endpoint: argo-artifacts.argo.svc.cluster.local:9000
      insecure: true
      accessKeySecret:
        name: my-minio-cred
        key: accessKey
      secretKeySecret:
        name: my-minio-cred
        key: secretKey
