customRules:
  detect_write_to_target.yaml: |
    - macro: work_tmp_dir
      condition: fd.is_upper_layer=true and (fs.path.name contains "/work/tmp" or fs.path.name contains "/mainctrfs/work/tmp")

    - rule: something_work
      desc: something happened below /work
      condition: work_tmp_dir and k8s.ns.name = "argo"
      output: "Something below a /work directory happened | user=%user.name command=%proc.cmdline file=%fd.name evt=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING