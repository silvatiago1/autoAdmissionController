customRules:
  detect_echo.yaml: |
    - macro: cmd_events_flags
      condition: >
        proc.name = sh and
        evt.type=open and
        fd.typechar='f'

    - macro: work_tmp_file
      condition: fs.path.name contains "/workspace/message" or fs.path.name contains "/mainctrfs/workspace/message"

    - macro: allowed_files
      condition: fs.path.name = /lib/x86_64-linux-gnu/libc.so.6 or fs.path.name = /etc/ld.so.cache

    - rule: detect_echo
      desc: echo has activity inside /workspace/message
      condition: cmd_events_flags and (not work_tmp_file) and k8s.ns.name = "argo" and not allowed_files
      output: "Echo, /workspace/message | user=%user.name command=%proc.cmdline file=%fd.name evt_type=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING
      