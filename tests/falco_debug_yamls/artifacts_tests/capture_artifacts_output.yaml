customRules:
  detect_outside_scope.yaml: |
    - macro: cmd_events_flags
      condition: >
        proc.name = argoexec and
        (evt.type in (open, openat) and evt.is_open_write=true) and
        fd.typechar='f'

    - macro: link_path_artifacts
      condition: evt.arg.linkpath startswith "/argo/inputs/artifacts/"

    - macro: correct_file
      condition: fs.path.name contains "hello_world.txt"

    - rule: write_work_dir
      desc: tar has activity outside /work/tmp
      condition: correct_file and k8s.ns.name = "argo"
      output: "Artifact Captured | user=%user.name command=%proc.cmdline parent=%proc.acmdline[1] grandparent=%proc.aname[2] file=%fd.name file_source=%fs.path.source file_target=%fs.path.target linkpath=%evt.arg.linkpath target=%evt.arg.target evt_type=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING