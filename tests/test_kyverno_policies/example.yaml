apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: limit-argo-cpu
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-cpu-limit
      match:
        any:
          - resources:
              kinds:
                - Workflow
      validate:
        message: "CPU limit must be less than or equal to 99m."
        foreach:
          - list: "request.object.spec.templates[].container"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.limits.cpu || '0' }}"
                    operator: GreaterThan
                    value: "99m"