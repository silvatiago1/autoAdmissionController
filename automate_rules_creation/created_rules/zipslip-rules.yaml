customRules:
  zipslip-orange-cmd-in-conf-not-args.yaml: |
    - macro: conf_cmd
      condition: proc.name="sh"

    - macro: in_pod
      condition: k8s.pod.name startswith "zipslip-" and k8s.pod.name contains "orange"

    - macro: conf_cmd_args
      condition: proc.cmdline="sh -c echo 'Starting container'; sleep 3000"

    - rule: zipslip-detect-container-unconfigured-commands
      desc: Non-Argo default command/Non-Defined in yaml command detected
      condition: conf_cmd and not conf_cmd_args and k8s.ns.name = "argo" and in_pod
      output: "Detected unknown args in configured command | user=%user.name command_name=%proc.name command=%proc.cmdline file=%fd.name file_source=%fs.path.source file_target=%fs.path.target linkpath=%evt.arg.linkpath target=%evt.arg.target evt_type=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING
  zipslip-orange-detect-path-extraction-mnt-vol.yaml: |
    - macro: cmd_events_flags
      condition: >
        (proc.cmdline startswith "argoexec init" and
        evt.type=openat and
        (evt.arg.flags contains O_CREAT and evt.arg.flags contains O_CLOEXEC and evt.arg.flags contains O_RDWR and evt.arg.flags contains O_F_CREATED))

    - macro: file_path
      condition: fs.path.name contains "/work/tmp" or fs.path.name contains "/mainctrfs/work/tmp"

    - macro: in_mainctrfs
      condition: fs.path.name contains "/mainctrfs/" or evt.arg.target contains "/mainctrfs/"

    - macro: in_pod
      condition: k8s.pod.name startswith "zipslip-"

    - macro: link_path_artifacts
      condition: evt.arg.linkpath startswith "/argo/inputs/artifacts/"

    - macro: wrong_target
      condition: not (evt.arg.target contains "/work/tmp") and not (evt.arg.target contains "/mainctrfs/work/tmp")

    - macro: benign_files
      condition: fs.path.name="/var/run/argo/argoexec" or fs.path.name="/argo/inputs/artifacts/evil.tmp" or fs.path.name="/var/run/argo/template" or fs.path.name startswith "/argo/inputs/artifacts/evil.tmpdir/"

    - rule: zipslip-detect-path-extraction-mnt-vol
      desc: File extraction outside /work/tmp
      condition: ((cmd_events_flags and (not file_path) and not benign_files) or (create_symlink and link_path_artifacts and wrong_target)) and k8s.ns.name = "argo" and in_pod and proc.cmdline startswith "argoexec init" and in_mainctrfs
      output: "File extraction outside of the intended path, to a mounted volume's path, /work/tmp | user=%user.name command=%proc.cmdline file=%fd.name file_source=%fs.path.source file_target=%fs.path.target linkpath=%evt.arg.linkpath target=%evt.arg.target evt_type=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING
  zipslip-orange-detect-path-extraction-arg-path.yaml: |
    - macro: cmd_events_flags
      condition: >
        (proc.cmdline startswith "argoexec init" and
        evt.type=openat and
        (evt.arg.flags contains O_CREAT and evt.arg.flags contains O_CLOEXEC and evt.arg.flags contains O_RDWR and evt.arg.flags contains O_F_CREATED))

    - macro: file_path
      condition: fs.path.name contains "/work/tmp" or fs.path.name contains "/mainctrfs/work/tmp"

    - macro: in_mainctrfs
      condition: fs.path.name contains "/mainctrfs/" or evt.arg.target contains "/mainctrfs/"

    - macro: in_pod
      condition: k8s.pod.name startswith "zipslip-"

    - macro: link_path_artifacts
      condition: evt.arg.linkpath startswith "/argo/inputs/artifacts/"

    - macro: wrong_target
      condition: not (evt.arg.target contains "/work/tmp") and not (evt.arg.target contains "/mainctrfs/work/tmp")

    - macro: benign_files
      condition: fs.path.name="/var/run/argo/argoexec" or fs.path.name="/argo/inputs/artifacts/evil.tmp" or fs.path.name="/var/run/argo/template" or fs.path.name startswith "/argo/inputs/artifacts/evil.tmpdir/"

    - rule: zipslip-detect-path-extraction-arg-path
      desc: File extraction outside /work/tmp
      condition: ((cmd_events_flags and (not file_path) and not benign_files) or (create_symlink and link_path_artifacts and wrong_target)) and k8s.ns.name = "argo" and in_pod and proc.cmdline startswith "argoexec init" and not in_mainctrfs
      output: "File extraction outside of the intended path, to an Argo path, /work/tmp | user=%user.name command=%proc.cmdline file=%fd.name file_source=%fs.path.source file_target=%fs.path.target linkpath=%evt.arg.linkpath target=%evt.arg.target evt_type=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING
