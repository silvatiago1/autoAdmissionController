customRules:
  artifact-passing-cmd-in-conf-not-args.yaml: |
    - macro: conf_cmd
      condition: proc.name="sh"

    - macro: in_pod
      condition: k8s.pod.name startswith "artifact-passing-" and k8s.pod.name contains "print-message-from-file"

    - macro: conf_cmd_args
      condition: proc.cmdline="sh -c cat /tmp/message"

    - rule: artifact-passing-detect-container-unconfigured-commands
      desc: Non-Argo default command/Non-Defined in yaml command detected
      condition: conf_cmd and not conf_cmd_args and k8s.ns.name = "argo" and in_pod
      output: "Detected unknown args in configured command | user=%user.name command_name=%proc.name command=%proc.cmdline file=%fd.name file_source=%fs.path.source file_target=%fs.path.target linkpath=%evt.arg.linkpath target=%evt.arg.target evt_type=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING
  artifact-passing-detect-path-extraction-mnt-vol.yaml: |
    - macro: cmd_events_flags
      condition: >
        (proc.cmdline startswith "argoexec init" and
        evt.type=openat and
        (evt.arg.flags contains O_CREAT and evt.arg.flags contains O_CLOEXEC and evt.arg.flags contains O_RDWR and evt.arg.flags contains O_F_CREATED))

    - macro: file_path
      condition: fs.path.name contains "/tmp/message" or fs.path.name contains "/mainctrfs/tmp/message"

    - macro: in_mainctrfs
      condition: fs.path.name contains "/mainctrfs/" or evt.arg.target contains "/mainctrfs/"

    - macro: in_pod
      condition: k8s.pod.name startswith "artifact-passing-" and k8s.pod.name contains "print-message-from-file"

    - macro: link_path_artifacts
      condition: evt.arg.linkpath startswith "/argo/inputs/artifacts/"

    - macro: wrong_target
      condition: not (evt.arg.target contains "/tmp/message") and not (evt.arg.target contains "/mainctrfs/tmp/message")

    - macro: benign_files
      condition: fs.path.name="/var/run/argo/argoexec" or fs.path.name="/argo/inputs/artifacts/message.tmp" or fs.path.name="/var/run/argo/template" or fs.path.name startswith "/argo/inputs/artifacts/message.tmpdir/"

    - rule: artifact-passing-detect-path-extraction-mnt-vol
      desc: File extraction outside /tmp/message
      condition: ((cmd_events_flags and (not file_path) and not benign_files) or (create_symlink and link_path_artifacts and wrong_target)) and k8s.ns.name = "argo" and in_pod and proc.cmdline startswith "argoexec init" and in_mainctrfs
      output: "File extraction outside of the intended path, to a mounted volume's path, /tmp/message | user=%user.name command=%proc.cmdline file=%fd.name file_source=%fs.path.source file_target=%fs.path.target linkpath=%evt.arg.linkpath target=%evt.arg.target evt_type=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING
  artifact-passing-detect-path-extraction-arg-path.yaml: |
    - macro: cmd_events_flags
      condition: >
        (proc.cmdline startswith "argoexec init" and
        evt.type=openat and
        (evt.arg.flags contains O_CREAT and evt.arg.flags contains O_CLOEXEC and evt.arg.flags contains O_RDWR and evt.arg.flags contains O_F_CREATED))

    - macro: file_path
      condition: fs.path.name contains "/tmp/message" or fs.path.name contains "/mainctrfs/tmp/message"

    - macro: in_mainctrfs
      condition: fs.path.name contains "/mainctrfs/" or evt.arg.target contains "/mainctrfs/"

    - macro: in_pod
      condition: k8s.pod.name startswith "artifact-passing-" and k8s.pod.name contains "print-message-from-file"

    - macro: link_path_artifacts
      condition: evt.arg.linkpath startswith "/argo/inputs/artifacts/"

    - macro: wrong_target
      condition: not (evt.arg.target contains "/tmp/message") and not (evt.arg.target contains "/mainctrfs/tmp/message")

    - macro: benign_files
      condition: fs.path.name="/var/run/argo/argoexec" or fs.path.name="/argo/inputs/artifacts/message.tmp" or fs.path.name="/var/run/argo/template" or fs.path.name startswith "/argo/inputs/artifacts/message.tmpdir/"

    - rule: artifact-passing-detect-path-extraction-arg-path
      desc: File extraction outside /tmp/message
      condition: ((cmd_events_flags and (not file_path) and not benign_files) or (create_symlink and link_path_artifacts and wrong_target)) and k8s.ns.name = "argo" and in_pod and proc.cmdline startswith "argoexec init" and not in_mainctrfs
      output: "File extraction outside of the intended path, to an Argo path, /tmp/message | user=%user.name command=%proc.cmdline file=%fd.name file_source=%fs.path.source file_target=%fs.path.target linkpath=%evt.arg.linkpath target=%evt.arg.target evt_type=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING
