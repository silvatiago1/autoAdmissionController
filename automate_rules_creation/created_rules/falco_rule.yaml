customRules:
  zipslip-detect_path_extraction.yaml: |
    - macro: cmd_events_flags
      condition: >
        (proc.name = argoexec and
        evt.type=openat and
        (evt.arg.flags contains O_CREAT and evt.arg.flags contains O_CLOEXEC and evt.arg.flags contains O_RDWR and evt.arg.flags contains O_F_CREATED))

    - macro: file_path
      condition: fs.path.name contains "/work/tmp" or fs.path.name contains "/mainctrfs/work/tmp"

    - macro: in_mainctrfs
      condition: fs.path.name contains "/mainctrfs/"

    - macro: in_pod
      condition: k8s.pod.name startswith "zipslip-"

    - rule: write_tmp_dir
      desc: File extraction outside /work/tmp
      condition: cmd_events_flags and (not file_path) and in_mainctrfs and k8s.ns.name = "argo" and in_pod
      output: "File extraction outside of the intended path, /work/tmp | user=%user.name command=%proc.cmdline file=%fd.name evt_type=%evt.type evt_arg_flags=%evt.arg.flags"
      priority: WARNING
